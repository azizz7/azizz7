<svg xmlns="http://www.w3.org/2000/svg" width="440" height="208" viewBox="0 0 440 208" role="img" aria-label="DocuMind: Chat with your PDFs. RAG pipeline with cited sources, streamed answers, multi-document search and RAGAS evaluation.">
  <title>DocuMind</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162a"/><stop offset="1" stop-color="#0a0e19"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#6d5dfc" stop-opacity=".22"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <clipPath id="r"><rect width="440" height="208" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="440" height="208" fill="url(#bg)"/>
    <rect width="440" height="208" fill="url(#glow)" transform="scale(1.6 1.2)"/>
    <rect x="24" width="44" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="207" rx="13.5" fill="none" stroke="#252d45"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="24" y="34" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8b9bb8">AI · RAG</text>
    <text x="416" y="34" font-size="11" font-weight="600" letter-spacing="1.4" text-anchor="end" fill="#7aa7ff">GITHUB ↗</text>
    <text x="24" y="76" font-size="22" font-weight="600" fill="#f5f7fb">DocuMind</text>
  <text x="24" y="108" font-size="14" fill="#aab4c5">Chat with your PDFs. RAG pipeline with cited</text>
  <text x="24" y="129" font-size="14" fill="#aab4c5">sources, streamed answers, multi-document search</text>
  <text x="24" y="150" font-size="14" fill="#aab4c5">and RAGAS evaluation.</text>
    <line x1="24" y1="168" x2="416" y2="168" stroke="#1f2740"/>
    <text x="24" y="191" font-size="12" font-weight="600" fill="#7aa7ff">Apr 2026</text>
    <text x="416" y="191" font-size="12" text-anchor="end" fill="#7f8aa3">Python · FastAPI · LangChain · ChromaDB · React</text>
