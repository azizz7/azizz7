<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Decorative gradient banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#cfe3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="280" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="280" fill="url(#bg)"/>
    <ellipse cx="170" cy="250" rx="360" ry="190" fill="url(#amber)"/>
    <ellipse cx="420" cy="90" rx="380" ry="170" fill="url(#violet)"/>
    <ellipse cx="860" cy="230" rx="420" ry="170" fill="url(#blue)"/>
    <ellipse cx="1130" cy="60" rx="260" ry="120" fill="url(#violet)" opacity="0.7"/>
    <path d="M640 280 L1180 0" stroke="url(#streak)" stroke-width="2.5" fill="none"/>
    <path d="M700 280 L1230 20" stroke="url(#streak)" stroke-width="1" fill="none" opacity="0.6"/>
  </g>
</svg>
